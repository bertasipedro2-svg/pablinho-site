name: Publicar Pablinho Site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar site
        uses: actions/checkout@v6
      - name: Validar arquivos
        run: |
          test -s index.html
          test -s imperial-v4-2-images.js
          test -s imperial-v4-2.css
          test -s imperial-v4-2.js
          test -s imperial-v4-3.css
          test -s imperial-v4-3.js
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
